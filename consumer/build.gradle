plugins {
	id 'library-events.spring-service-conventions'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	implementation project(':contracts')
	compileOnly 'io.soabase.record-builder:record-builder-core:44'
	annotationProcessor 'io.soabase.record-builder:record-builder-processor:44'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testFixturesApi testFixtures(project(':contracts'))
	testFixturesImplementation project(':shared-kernel')
	testFixturesImplementation 'org.springframework:spring-web'
	testFixturesImplementation 'org.assertj:assertj-core'
	testFixturesImplementation 'org.springframework:spring-test'
	testFixturesImplementation 'tools.jackson.core:jackson-databind'
	testFixturesImplementation 'org.springframework.kafka:spring-kafka'
	testFixturesImplementation 'org.springframework.kafka:spring-kafka-test'
	testFixturesImplementation 'org.springframework.boot:spring-boot-test'
	testFixturesImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testFixturesImplementation 'org.testcontainers:testcontainers-postgresql'
}
