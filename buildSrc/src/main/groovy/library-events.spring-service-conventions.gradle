plugins {
	id 'library-events.java-conventions'
	id 'java-test-fixtures'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

dependencies {
	implementation project(':shared-kernel')
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

testing {
	suites {
		test {
			useJUnitJupiter()
			sources {
				java { srcDirs = ['src/test/unit/java'] }
				resources { srcDirs = ['src/test/unit/resources'] }
			}
		}
		integrationTest(JvmTestSuite) {
			useJUnitJupiter()
			dependencies {
				implementation project()
				implementation testFixtures(project())
			}
			sources {
				java { srcDirs = ['src/test/integration/java'] }
				resources { srcDirs = ['src/test/integration/resources'] }
			}
			targets {
				all {
					testTask.configure { shouldRunAfter(test) }
				}
			}
		}
	}
}

sourceSets {
	testFixtures {
		java { srcDirs = ['src/test/utils/java'] }
		resources { srcDirs = ['src/test/utils/resources'] }
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.named('check') {
	dependsOn(testing.suites.integrationTest)
}

tasks.named('bootRun') {
	workingDir = rootDir
}
