plugins {
	id 'java'
	id 'java-test-fixtures'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.learnjava'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'io.soabase.record-builder:record-builder-core:44'
	annotationProcessor 'io.soabase.record-builder:record-builder-processor:44'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testFixturesImplementation 'org.springframework:spring-web'
	testFixturesImplementation 'org.assertj:assertj-core'
	testFixturesImplementation 'org.springframework:spring-test'
	testFixturesImplementation 'tools.jackson.core:jackson-databind'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

testing {
	suites {
		test {
			useJUnitJupiter()
			sources {
				java { srcDirs = ['src/test/unit/java'] }
				resources { srcDirs = ['src/test/unit/resources'] }
			}
		}
		integrationTest(JvmTestSuite) {
			useJUnitJupiter()
			dependencies {
				implementation project()
				implementation testFixtures(project())
			}
			sources {
				java { srcDirs = ['src/test/integration/java'] }
				resources { srcDirs = ['src/test/integration/resources'] }
			}
			targets {
				all {
					testTask.configure { shouldRunAfter(test) }
				}
			}
		}
	}
}

sourceSets {
	testFixtures {
		java { srcDirs = ['src/test/utils/java'] }
		resources { srcDirs = ['src/test/utils/resources'] }
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.named('check') {
	dependsOn(testing.suites.integrationTest)
}
